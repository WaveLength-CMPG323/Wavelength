<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WaveLength — Welcome</title>
<link rel="stylesheet" href="wavelength_login.css">
</head>
<body>

<div class="page">

  <div class="brand">
    <div class="brand-mark">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M2 14c2-3 4-3 6 0s4 3 6 0 4-3 6 0"
              stroke="#3d2fb0" stroke-width="2" stroke-linecap="round" fill="none"/>
      </svg>
    </div>
    <div class="brand-word">WaveLength</div>
  </div>
  <div class="tagline">Discover, connect and listen with people around the world</div>

  <div class="center-wrap">
    <div class="card">
      <h1>Welcome</h1>
      <p>Sign in to discover new music and connect with people who share your sound.</p>
      <button class="spotify-btn" type="button">
        <svg viewBox="0 0 24 24" fill="#1ED760" xmlns="http://www.w3.org/2000/svg">
          <circle cx="12" cy="12" r="11"/>
        </svg>
        <span style="position:relative;">Continue with Spotify</span>
      </button>
      <div class="fine-print">By continuing, you agree to WaveLength's Terms &amp; Privacy Policy</div>
    </div>
  </div>

  <div class="waves-wrap">
    <svg class="waves" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
         viewBox="0 24 150 28" preserveAspectRatio="none" shape-rendering="auto">
      <defs>
        <path id="gentle-wave" d="M-160 44c30 0 58-18 88-18s 58 18 88 18 58-18 88-18 58 18 88 18 v44h-352z" />
      </defs>
      <g class="parallax">
        <use xlink:href="#gentle-wave" x="48" y="0" fill="rgba(255,255,255,0.7)" />
        <use xlink:href="#gentle-wave" x="48" y="3" fill="rgba(255,255,255,0.5)" />
        <use xlink:href="#gentle-wave" x="48" y="5" fill="rgba(255,255,255,0.3)" />
        <use xlink:href="#gentle-wave" x="48" y="7" fill="#fff" />
      </g>
    </svg>
  </div>

  <!--Floating album covers sit in their own band, sized the same as the wave itself,
      so their bottom-offsets are read against the wave's height, not the page's-->
  <div class="ocean-floaters">
    <div class="float-card fc-1"><span>Peace of Mind</span></div>
    <div class="float-card fc-2"><span>Aftermath</span></div>
    <div class="float-card fc-3"><span>Flower</span></div>
  </div>

</div>

</body>
</html>
