services:
  - type: web
    name: wavelength-backend
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm install && npm run build
    preDeployCommand: npx prisma migrate deploy
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false

databases:
  - name: wavelength-db
    plan: free